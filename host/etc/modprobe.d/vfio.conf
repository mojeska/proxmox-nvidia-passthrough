# Hand the NVIDIA GPU and its HDMI audio to vfio-pci before any host driver claims them.
# Replace the IDs with your card's (lspci -nn | grep -i nvidia). These are an RTX 5070 Ti.
options vfio-pci ids=10de:2c05,10de:22e9 disable_vga=1
softdep nouveau pre: vfio-pci
softdep nvidia pre: vfio-pci
softdep snd_hda_intel pre: vfio-pci
