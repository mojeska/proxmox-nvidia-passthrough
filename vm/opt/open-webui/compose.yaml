# Open WebUI on port 8080, using Ollama on the same VM.
# Set WEBUI_URL to the address people will use (the HTTPS name if you put a reverse proxy in front).
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    network_mode: host
    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      WEBUI_URL: https://ai.example.lan
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped
volumes:
  open-webui:
